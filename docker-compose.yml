services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: periscope_app
    ports:
      - "${PORT:-8006}:8006"
    volumes:
      - .:/app
    environment:
      - PORT=8006
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-periscope}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_NAME=${DB_NAME:-periscope_db}
      - S3_ENDPOINT=rustfs:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-rustfsadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-rustfsadmin}
      - S3_BUCKET=${S3_BUCKET:-periscope-telemetry}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_SSL=false
      - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY:-super_secret_aes_32_byte_key_ex}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_example}
    depends_on:
      - postgres
      - rustfs

  postgres:
    image: postgres:17
    container_name: periscope_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-periscope}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-periscope_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs:latest
    container_name: periscope_rustfs
    restart: always
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: "/data"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-rustfsadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

volumes:
  postgres_data:
  rustfs_data:
