version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: periscope_app
    ports:
      - "${PORT:-8006}:8006"
    volumes:
      - .:/app
    environment:
      - PORT=8006
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-periscope}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_NAME=${DB_NAME:-periscope_db}
      - S3_ENDPOINT=minio:9000
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - S3_BUCKET=${S3_BUCKET:-periscope-telemetry}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_USE_SSL=false
      - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY:-super_secret_aes_32_byte_key_ex}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_example}
    depends_on:
      - postgres
      - minio

  postgres:
    image: postgres:17
    container_name: periscope_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-periscope}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-periscope_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: periscope_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Uncomment the below service later if we want a separate UI container in dev
  # ui:
  #   build:
  #     context: ./ui
  #   container_name: periscope_ui
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./ui:/app
  #     - /app/node_modules

volumes:
  postgres_data:
  minio_data:
